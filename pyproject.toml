[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-gp"
version = "2.0.0"
description = "Agentic Grand Prix: a deterministic 2D racing gym where students write single-file AI drivers (code, LLM, fly brain)"
readme = "README.md"
requires-python = ">=3.11"          # Streamlit 1.66 needs 3.11+
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",                  # driverkit.racing_line (sparse solve; numpy fallback without it)
    "matplotlib>=3.8",
    "plotly>=5.20",
    "pandas>=2.1",
    "streamlit>=1.66",              # the Streamlit tutorial (streamlit_lessons/) and app/ need 1.66 APIs
    "openai>=2",                    # agentic_gp.llm (MiniMax / any OpenAI-compatible provider)
    "langgraph>=0.2",               # only the LangGraph pit-crew example
    "langchain-openai>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Ch7 "Fly Brains": numba speeds up the LIF simulator (optional, pure numpy without it);
# pyarrow + pandas are needed only by agentic_gp.fly.extract (instructor: rebuild the circuit file).
# pip install -e ".[fly]"   or   uv sync --extra fly
fly = ["numba>=0.60", "pyarrow>=15", "pandas>=2.1"]

# uv: `uv sync` installs the "dev" group by default, so `uv run pytest` works right after cloning.
# Python 3.12 is pinned in .python-version; uv.lock pins every package version (commit both).
[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
agentic-gp = "agentic_gp.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_gp*"]

[tool.setuptools.package-data]
"agentic_gp" = ["viz/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "llm: live MiniMax calls (opt-in: AGP_LIVE_LLM=1)",
    "slow: multi-process grand prix tests",
]
