<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1684 1191" width="1684" height="1191" role="img" aria-labelledby="t d">
  <title id="t">The driver ladder</title>
  <desc id="d">Seven steps from L0 (no perception) to L6 Max (a tool-using multi-role LLM team), plus the spiking fly brains as a side branch. Each step shows the agent type, the idea it adds, its lap time on the home track and its anatomy.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; fill: #0b0b0b; }
      .kicker { font-size: 20px; letter-spacing: 3px; fill: #898781; font-weight: 600; }
      .title { font-size: 60px; font-weight: 700; }
      .sub { font-size: 28px; fill: #52514e; }
      .lv { font-size: 34px; font-weight: 800; }
      .ch { font-size: 20px; font-weight: 700; }
      .nm { font-size: 28px; font-weight: 700; }
      .fl { font-family: "Cascadia Code", Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 15px; fill: #52514e; }
      .ty { font-size: 21px; font-weight: 700; fill: #0b0b0b; }
      .cc { font-size: 16.5px; fill: #52514e; }
      .lp { font-size: 27px; font-weight: 800; }
      .lp2 { font-size: 16.5px; fill: #52514e; }
      .s { font-size: 20px; fill: #52514e; }
      .b { font-size: 22px; }
      .foot { font-size: 18px; fill: #898781; }
    </style>
    <marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
  </defs>
  <rect width="1684" height="1191" fill="#fcfcfb"/>
  <text x="72" y="84" class="kicker">AGENTIC GRAND PRIX  ·  POSTER  ·  THE LADDER</text>
  <text x="72" y="152" class="title">The driver ladder</text>
  <text x="72" y="200" class="sub">One single file, a little more agentic every chapter. Each step adds one idea - and a new way to fail.</text>

  <!-- side branch: spiking brains -->
  <g transform="translate(72,248)">
    <rect width="420" height="292" rx="18" fill="#fdf1f6" stroke="#e87ba4" stroke-width="3"/>
    <text x="22" y="40" class="ch" style="fill:#b23c6b">SIDE BRANCH  ·  Ch 7</text>
    <text x="22" y="76" class="nm">Spiking fly brains</text>
    <text x="22" y="104" class="cc">neurons as the controller - no rules, no LLM</text>
    <rect x="18" y="122" width="186" height="152" rx="12" fill="#ffffff" stroke="#e87ba4" stroke-width="2"/>
    <text x="32" y="152" class="ty">Fly Toy</text>
    <text x="32" y="174" class="fl">fly_toy.py</text>
    <text x="32" y="198" class="cc">~57 LIF neurons,</text>
    <text x="32" y="218" class="cc">wired by hand</text>
    <text x="32" y="254" class="lp" style="font-size:24px">63.3 s</text>
    <rect x="216" y="122" width="186" height="152" rx="12" fill="#ffffff" stroke="#e87ba4" stroke-width="2"/>
    <text x="230" y="152" class="ty">Fly Connectome</text>
    <text x="230" y="174" class="fl">fly_connectome.py</text>
    <text x="230" y="198" class="cc">4,494 real FlyWire</text>
    <text x="230" y="218" class="cc">neurons</text>
    <text x="230" y="254" class="lp" style="font-size:24px">117.1 s</text>
    <text x="320" y="254" class="lp2">2 crashes</text>
  </g>

  <!-- legend -->
  <g transform="translate(560,262)">
    <text x="0" y="0" class="b" font-weight="700">How to read a step</text>
    <text x="0" y="32" class="s">big number = lap time on the home track (grand_prix)</text>
    <g transform="translate(10,62)"><circle cx="0" cy="0" r="6.5" fill="#52514e"/><circle cx="18" cy="0" r="6.5" fill="#52514e"/><circle cx="36" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="54" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="72" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="90" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="108" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="126" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="144" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/><circle cx="162" cy="0" r="5.5" fill="none" stroke="#c3c2b7" stroke-width="2"/></g>
